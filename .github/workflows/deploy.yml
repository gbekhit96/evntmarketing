name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public URL of the Cloudflare Worker that handles contact-form POSTs.
          # Set in repo Settings -> Secrets and variables -> Actions -> Variables.
          # Not a secret: it is a public endpoint and Vite inlines it into the bundle.
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
        run: npm run build

      - name: Add SPA fallback for client-side routes
        # GitHub Pages serves 404.html for any path it can't find on disk.
        # Shipping a copy of the built index.html lets react-router handle deep
        # links and page refreshes instead of showing the GitHub 404 page.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
